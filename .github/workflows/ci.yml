name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rtl-and-hil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r sim/requirements.txt

      - name: RTL unit testbenches (FSM, windowed counter, AXI-Stream pipeline)
        run: make unit-tb

      - name: Parity + model tests (event pipeline == rate-fed FSM, RTL == golden)
        run: make test

      - name: Closed-loop HIL episode against the RTL under Icarus
        run: make cosim

      - name: Single-packet replay through the pipeline
        run: python3 sim/replay_bench.py --repeat 1

      - name: Randomized stress-test smoke check
        run: ./scripts/run_stress_test.sh --episodes 5 --seed 0

      - name: Noisy-sensor smoke check
        run: python3 sim/stress_test.py --episodes 3 --seed 100 --noise 10 --out results/stress_noise.csv

      - name: Upload cosim results
        uses: actions/upload-artifact@v4
        with:
          name: cosim-results
          path: results/

  # Vivado synthesis and the PYNQ-Z2 run are not reproducible on a hosted
  # runner (multi-GB proprietary toolchain, physical board); see
  # docs/pynq_bringup.md for the on-hardware checklist.

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run parity tests
        run: npm test

      - name: Build
        run: npm run build
